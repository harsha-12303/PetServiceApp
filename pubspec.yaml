name: petcare_services
description: PetCareServices administrator app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.2
  google_fonts: ^6.2.1
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

# App icon: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  adaptive_icon_background: "#002BE3"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#002BE3"
    theme_color: "#002BE3"
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256

# Launch screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#002BE3"
  image: assets/images/logo_foreground.png
  android_12:
    color: "#002BE3"
    image: assets/images/logo_foreground.png
    icon_background_color: "#002BE3"
  web: true

